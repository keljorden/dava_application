name: Build DAVA Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib seaborn openpyxl pyinstaller

      - name: Compile with PyInstaller
        run: |
          pyinstaller --onefile --windowed --collect-all matplotlib --collect-all seaborn --name "DAVA" dava.py

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: DAVA-Windows
          path: dist/DAVA.exe
